<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d1a">
  <meta name="description" content="The page you’re looking for can’t be found.">
  <title>404 — Page not found</title>
  <style>
    :root { color-scheme: dark; --ink:#f6f5ff; --muted:#a8a8bd; --violet:#a69bff; --mint:#65e0d1; }
    * { box-sizing:border-box; }
    body {
      min-height:100vh; margin:0; display:grid; place-items:center; overflow-x:hidden;
      color:var(--ink); background:radial-gradient(ellipse at 76% 35%,rgba(92,73,178,.2),transparent 34rem),radial-gradient(ellipse at 14% 90%,rgba(24,119,132,.12),transparent 32rem),#0c0d1a;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .page { width:min(1120px,100%); min-height:100vh; padding:36px clamp(24px,6vw,80px); display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:11px; color:#e7e5f4; font-size:.78rem; font-weight:750; letter-spacing:.16em; }
    .mark { width:28px; height:28px; display:grid; place-items:center; border:1px solid #ffffff47; border-radius:9px; background:linear-gradient(140deg,#a69bff,#6658d9); box-shadow:0 5px 20px #7d70ff47; }
    main { flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(330px,.95fr); align-items:center; gap:clamp(32px,6vw,88px); padding:40px 0 56px; }
    .copy { max-width:500px; }
    .eyebrow { display:flex; align-items:center; gap:9px; margin:0 0 22px; color:var(--mint); font-size:.75rem; font-weight:750; letter-spacing:.17em; text-transform:uppercase; }
    .eyebrow:before { content:""; width:20px; height:1px; background:currentColor; }
    h1 { max-width:10ch; margin:0; font-size:clamp(2.7rem,5.5vw,5rem); line-height:.99; letter-spacing:-.065em; font-weight:680; }
    h1 span { color:transparent; background:linear-gradient(100deg,#c4bdff 5%,#8f83ff 54%,#69ded0 112%); background-clip:text; -webkit-background-clip:text; }
    .description { max-width:400px; margin:24px 0 0; color:var(--muted); font-size:clamp(1rem,1.5vw,1.1rem); line-height:1.75; }
    .actions { display:flex; flex-wrap:wrap; gap:14px; margin-top:34px; }
    .button { min-height:50px; padding:0 21px; display:inline-flex; align-items:center; justify-content:center; gap:10px; border:1px solid transparent; border-radius:14px; font:inherit; font-size:.92rem; font-weight:700; text-decoration:none; cursor:pointer; transition:transform .2s,background .2s,border-color .2s,box-shadow .2s; }
    .button:hover { transform:translateY(-2px); }
    .button:focus-visible { outline:3px solid white; outline-offset:4px; }
    .primary { color:#101020; background:linear-gradient(110deg,#c7c0ff,#9f93ff); box-shadow:0 9px 28px #8777ff3d; }
    .primary:hover { background:linear-gradient(110deg,#d8d3ff,#afa6ff); box-shadow:0 12px 32px #8777ff57; }
    .secondary { color:#e4e3f1; background:#ffffff09; border-color:#ffffff1f; }
    .secondary:hover { background:#ffffff12; border-color:#ffffff3d; }
    .button svg { width:17px; height:17px; }
    .art { position:relative; width:100%; max-width:490px; aspect-ratio:1; justify-self:center; display:grid; place-items:center; border:1px solid #ffffff17; border-radius:50%; background:radial-gradient(circle at 50% 48%,#8270ff1f,#8270ff04 56%,transparent 70%); }
    .art:before,.art:after { position:absolute; content:""; border:1px solid #cac5ff21; border-radius:50%; inset:8%; }
    .art:after { inset:17%; border-style:dashed; opacity:.7; transform:rotate(-18deg) scaleY(.72); }
    .orbit { position:absolute; width:72%; height:29%; border:1px solid #beb6ff78; border-radius:50%; transform:rotate(-28deg); box-shadow:0 0 18px #9a8eff1a; }
    .planet { position:relative; z-index:1; width:35%; aspect-ratio:1; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle at 34% 26%,#ffffff70,transparent 18%),radial-gradient(ellipse at 65% 76%,#59d6ceba,transparent 38%),linear-gradient(145deg,#9b8cff 4%,#6d60d4 58%,#403a91); box-shadow:inset -18px -20px 35px #12103c61,0 0 75px #7e6fff5e; }
    .planet span { font-size:clamp(3.1rem,8vw,6.7rem); font-weight:780; letter-spacing:-.1em; line-height:1; transform:translateX(-.04em); text-shadow:0 3px 18px #231d662e; }
    .spark { position:absolute; z-index:2; color:#e3e0ff; line-height:1; animation:twinkle 3.6s ease-in-out infinite; }
    .s1 { top:22%; left:23%; font-size:19px; } .s2 { top:30%; right:18%; color:var(--mint); font-size:13px; animation-delay:.9s; }
    .s3 { bottom:23%; right:25%; font-size:17px; animation-delay:1.8s; } .s4 { bottom:30%; left:16%; color:var(--mint); font-size:11px; animation-delay:2.4s; }
    .satellite { position:absolute; z-index:3; top:24%; right:21%; width:13px; height:13px; border-radius:50%; background:#d9d5ff; box-shadow:0 0 20px 4px #beb5ff73; }
    .satellite:after { position:absolute; content:""; width:27px; height:1px; top:6px; left:-7px; transform:rotate(45deg); background:#e2deff99; }
    footer { display:flex; justify-content:space-between; gap:16px; padding-top:18px; border-top:1px solid #ffffff1a; color:#77788f; font-size:.78rem; }
    footer a { color:#a9a8bd; text-decoration:none; } footer a:hover { color:var(--ink); text-decoration:underline; }
    @keyframes twinkle { 0%,100% { opacity:.48; transform:scale(.85); } 50% { opacity:1; transform:scale(1.14); } }
    @media(max-width:760px) {
      .page { padding:25px 24px 20px; }
      main { grid-template-columns:1fr; gap:14px; padding:44px 0 42px; }
      .copy { margin:0 auto; text-align:center; } .eyebrow { justify-content:center; }
      h1 { margin:0 auto; } .description { margin-left:auto; margin-right:auto; }
      .actions { justify-content:center; } .art { width:min(75vw,340px); grid-row:1; }
      .planet span { font-size:clamp(3rem,17vw,5rem); } footer { font-size:.72rem; }
    }
    @media(max-width:420px) {
      .page { padding-inline:19px; } .actions { flex-direction:column; align-items:stretch; }
      .button { width:100%; } footer { flex-direction:column; align-items:center; text-align:center; }
    }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <div class="page">
    <header aria-label="Site name"><span class="mark" aria-hidden="true">N</span><span>NOT ALL WHO WANDER</span></header>
    <main>
      <section class="copy" aria-labelledby="page-title">
        <p class="eyebrow">Error 404</p>
        <h1 id="page-title">Looks like this page <span>wandered off.</span></h1>
        <p class="description">The link may be out of date, or the page may have moved to another corner of the universe.</p>
        <div class="actions">
          <a class="button primary" href="/">Back to home
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <button class="button secondary" type="button" id="back-button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Go back
          </button>
        </div>
      </section>
      <div class="art" role="img" aria-label="A small planet marked 404 floating in space">
        <span class="spark s1" aria-hidden="true">✦</span><span class="spark s2" aria-hidden="true">✧</span>
        <span class="spark s3" aria-hidden="true">✦</span><span class="spark s4" aria-hidden="true">✧</span>
        <span class="orbit" aria-hidden="true"></span><span class="satellite" aria-hidden="true"></span>
        <div class="planet" aria-hidden="true"><span>404</span></div>
      </div>
    </main>
    <footer><span>Somewhere out there, the right page is waiting.</span><a href="/">Return to the homepage</a></footer>
  </div>
  <script>
    document.getElementById("back-button").addEventListener("click", function () {
      if (window.history.length > 1) window.history.back();
      else window.location.assign("/");
    });
  </script>
</body>
</html>
