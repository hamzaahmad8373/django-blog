{% extends 'base.html' %}

{% block content %}

{% load crispy_forms_tags %}

<div class="row">
    {% comment %} left sidebar {% endcomment %}
    {% include 'dashboard/sidebar.html' %}
    {% comment %} right sidebar {% endcomment %}
    <div class="col-md-9">
        <h2>New Category</h2>

        <form action="{% url 'add_category' %}" method="POST" style="width:500px">
            {% csrf_token %} 
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <br>
    </div>
</div>

{% endblock %}
